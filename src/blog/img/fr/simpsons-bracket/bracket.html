  <button type="button" id="zFit" aria-label="Fit whole bracket">&#x2922;</button>

<script>
(function () {
  // Frozen final bracket for the blog post: fits the frame, then pinch,
  // ctrl/cmd + scroll, double-click, or the buttons to zoom; drag to pan.
  var BW = 2180, BH = 2370, MAXZ = 6;
  var wrap = document.getElementById('boardWrap'), board = document.getElementById('board');
  var fit = 1, s = 1, x = 0, y = 0;
  function clamp() {
    var W = wrap.clientWidth, H = wrap.clientHeight, w = BW * s, h = BH * s;
    x = w <= W ? (W - w) / 2 : Math.min(0, Math.max(W - w, x));
    y = h <= H ? (H - h) / 2 : Math.min(0, Math.max(H - h, y));
  }
  function apply() {
    clamp();
    board.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    wrap.classList.toggle('zoomed', s > fit * 1.001);
  }
  function zoomAt(ns, px, py) {
    ns = Math.min(fit * MAXZ, Math.max(fit, ns));
    x = px - (px - x) * ns / s; y = py - (py - y) * ns / s; s = ns; apply();
  }
  function reset() {
    fit = Math.min(wrap.clientWidth / BW, wrap.clientHeight / BH); s = fit; apply();
  }
  function mid() { return [wrap.clientWidth / 2, wrap.clientHeight / 2]; }
  document.getElementById('zIn').onclick = function () { var m = mid(); zoomAt(s * 1.6, m[0], m[1]); };
  document.getElementById('zOut').onclick = function () { var m = mid(); zoomAt(s / 1.6, m[0], m[1]); };
  document.getElementById('zFit').onclick = reset;
  wrap.addEventListener('dblclick', function (e) {
    if (s >= fit * MAXZ * 0.99) reset(); else zoomAt(s * 2, e.clientX, e.clientY);
  });
  wrap.addEventListener('wheel', function (e) {
    if (e.ctrlKey || e.metaKey) {           // trackpad pinch arrives as ctrl + wheel
      e.preventDefault(); zoomAt(s * Math.exp(-e.deltaY * 0.01), e.clientX, e.clientY);
    } else if (s > fit * 1.001) {           // zoomed in: scrolling pans the bracket
      e.preventDefault(); x -= e.deltaX; y -= e.deltaY; apply();
    }                                        // at full view: the page scrolls as usual
  }, { passive: false });
  var pts = {}, last = null;
  function info() {
    var p = Object.keys(pts).map(function (k) { return pts[k]; });
    if (p.length >= 2) return { cx: (p[0].x + p[1].x) / 2, cy: (p[0].y + p[1].y) / 2,
      d: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y), n: 2 };
    return p.length ? { cx: p[0].x, cy: p[0].y, d: 0, n: 1 } : null;
  }
  wrap.addEventListener('pointerdown', function (e) {
    if (e.target.closest('.zoom-ctl')) return;
    pts[e.pointerId] = { x: e.clientX, y: e.clientY }; last = info();
    if (last.n === 2 || s > fit * 1.001) { wrap.setPointerCapture(e.pointerId); wrap.classList.add('dragging'); }
  });
  wrap.addEventListener('pointermove', function (e) {
    if (!pts[e.pointerId]) return;
    pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    var cur = info();
    if (!last || cur.n !== last.n) { last = cur; return; }
    if (cur.n === 2 && last.d > 0) {
      x += cur.cx - last.cx; y += cur.cy - last.cy;
      zoomAt(s * cur.d / last.d, cur.cx, cur.cy);
    } else if (cur.n === 1 && s > fit * 1.001) {
      x += cur.cx - last.cx; y += cur.cy - last.cy; apply();
    }
    last = cur;
  });
  function up(e) { delete pts[e.pointerId]; last = info(); if (!last) wrap.classList.remove('dragging'); }
  wrap.addEventListener('pointerup', up); wrap.addEventListener('pointercancel', up);
  window.addEventListener('resize', reset);
  reset();
})();
</script>
